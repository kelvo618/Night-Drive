<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Drive 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#1a1430;--ink:#f3efe6;--mut:#b9b3d6;--acc:#ff9f45;--card:rgba(38,32,68,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.fx{position:fixed;inset:0;pointer-events:none}
#vg{background:radial-gradient(ellipse at center,transparent 55%,rgba(8,4,22,.6))}
#bst{background:radial-gradient(ellipse at center,transparent 50%,rgba(255,159,69,.4));opacity:0;transition:opacity .25s}
.hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;font-weight:700;font-size:13px;pointer-events:none;text-shadow:0 1px 4px #000}
.hud b{font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:5px;background:#403b66;border-radius:3px;margin-top:4px}
.bar u{display:block;height:100%;background:var(--acc);border-radius:3px}
#pop{position:fixed;top:26%;left:0;right:0;text-align:center;font-weight:800;font-size:24px;color:var(--acc);opacity:0;pointer-events:none;text-shadow:0 2px 8px #000}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.panel.hide{display:none}
#menu{justify-content:flex-start;padding:0 max(24px,env(safe-area-inset-left));background:linear-gradient(to right,rgba(20,14,44,.92) 0,rgba(20,14,44,.7) 44%,transparent 60%)}
#over{flex-direction:column;gap:12px;background:rgba(20,14,44,.65)}
.mbox{max-height:100%;overflow:auto;padding:8px 0;width:min(46%,440px);display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:26px;letter-spacing:-1px;font-weight:800}
p{margin:0;color:var(--mut);font-size:13px}
.cars{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:40vh;overflow:auto}
.car{background:var(--card);border:2px solid transparent;border-radius:12px;padding:8px 10px;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.car[aria-pressed=true]{border-color:var(--acc)}
.car:focus-visible,.go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.car i{display:block;height:6px;border-radius:3px;margin-bottom:5px}
.car strong{display:block;font-size:13px}
.car span{font-size:11px;color:var(--mut)}
.go{background:var(--acc);color:#241a0c;border:0;border-radius:30px;font:inherit;font-weight:800;font-size:17px;padding:12px 40px;cursor:pointer}
.ctl{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-end}
.ctl div{display:flex;gap:12px}
.ctl button{width:84px;height:72px;border-radius:20px;border:0;background:rgba(255,255,255,.16);color:var(--ink);font-size:28px;font-weight:700;backdrop-filter:blur(6px)}
.ctl button.n{background:rgba(255,159,69,.42);font-size:15px;width:110px}
.modes{display:flex;gap:8px}.modes .car{flex:1;text-align:center;padding:7px;font-weight:700;font-size:13px}
#job{position:fixed;top:max(60px,calc(env(safe-area-inset-top) + 52px));left:50%;transform:translateX(-50%);max-width:72%;text-align:center;font-weight:700;font-size:13px;padding:5px 14px;border-radius:14px;background:rgba(20,14,44,.62);pointer-events:none;text-shadow:0 1px 3px #000}
#job:empty{display:none}#sir{opacity:0}
.ctl button.b{background:rgba(255,70,70,.45);font-size:15px;width:96px}
#pz{position:fixed;top:max(60px,calc(env(safe-area-inset-top) + 52px));right:max(16px,env(safe-area-inset-right));width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:var(--ink);font-size:20px;backdrop-filter:blur(6px)}
#pause,#set{background:rgba(10,6,22,.62)}
.sbox{width:min(520px,92%);max-height:94%;overflow:auto;background:rgba(24,18,50,.96);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:700}
.seg{display:flex;gap:6px}.seg button{background:var(--card);border:2px solid transparent;border-radius:10px;color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button.on{border-color:var(--acc)}
input[type=range]{width:55%;accent-color:#ff9f45}
#lft{align-items:flex-end}
#wheel{width:132px;height:132px;border-radius:50%;border:12px solid rgba(255,255,255,.38);background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.38)) center/100% 10px no-repeat,linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.38)) 50% 100%/10px 50% no-repeat,rgba(255,255,255,.06);touch-action:none;position:relative}
#wheel::before{content:"";position:absolute;top:-12px;left:50%;width:12px;height:12px;margin-left:-6px;background:var(--acc);border-radius:3px}
.hide{display:none!important}
#rot{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#140e2c;z-index:9;font-size:18px;font-weight:700}
#rot span{font-size:56px;display:block;animation:r 1.8s ease-in-out infinite}
@keyframes r{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){#rot span{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="fx" id="vg"></div><div class="fx" id="bst"></div>
<div class="hud"><div><span id="lbl">Cash</span><br><b id="sc">0</b></div><div style="text-align:center">Boost<div class="bar" style="width:100px"><u id="nb" style="width:100%"></u></div></div><div style="text-align:right">km/h<br><b id="sp">0</b></div></div>
<div id="pop"></div><div id="job"></div><div class="fx" id="sir"></div>
<div class="ctl hide" id="ctl"><div id="lft"><div id="wheel" class="hide"></div><div id="sb"><button id="bl" aria-label="Steer left">◀</button><button id="br" aria-label="Steer right">▶</button></div></div><div><button id="bb" class="b">BRAKE</button><button id="bn" class="n">BOOST</button></div></div>
<div class="panel" id="menu"><div class="mbox"><h1>Night Drive</h1><div class="modes" id="modes"></div><div class="cars" id="cars"></div><div style="display:flex;gap:10px"><button class="go" id="go">Start driving</button><button class="car" id="mset" aria-label="Settings">⚙</button></div><p id="best"></p></div></div>
<div class="panel hide" id="over"><h1 id="ttl">Game over</h1><p id="res" style="font-size:15px"></p><button class="go" id="again">Drive again</button><button class="car" id="chg" style="text-align:center">Change car</button></div>
<button id="pz" class="hide" aria-label="Pause">⏸</button>
<div class="panel hide" id="pause"><div class="sbox" style="text-align:center"><h1>Paused</h1><button class="go" id="resume">Resume</button><button class="car" id="pset" style="text-align:center">Settings</button><button class="car" id="quit" style="text-align:center">Quit to menu</button></div></div>
<div class="panel hide" id="set"><div class="sbox"><h1>Settings</h1>
<div class="row"><span>Sound</span><div class="seg" data-k="snd"><button data-v="1">On</button><button data-v="0">Off</button></div></div>
<div class="row"><span>Volume</span><input type="range" id="vol" min="0" max="100" aria-label="Volume"></div>
<div class="row"><span>Steering</span><div class="seg" data-k="ctl"><button data-v="btn">Buttons</button><button data-v="wheel">Wheel</button><button data-v="tilt">Tilt</button></div></div>
<div class="row"><span>Invert tilt</span><div class="seg" data-k="inv"><button data-v="0">No</button><button data-v="1">Yes</button></div></div>
<div class="row"><span>Graphics</span><div class="seg" data-k="q"><button data-v="low">Low</button><button data-v="high">High</button></div></div>
<div class="row"><span>Rain</span><div class="seg" data-k="rain"><button data-v="0">Off</button><button data-v="1">On</button></div></div>
<button class="go" id="sback">Back</button></div></div>
<div id="rot"><span>📱</span>Rotate your phone to landscape</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const CARS=[
{n:"BMW M4 Competition",d:"Coupé · 503 hp",c:0xb3200f,sp:8,hd:7,s:2},
{n:"BMW i4 M50",d:"Electric · 537 hp",c:0x1f56c9,sp:7,hd:9,s:0},
{n:"BMW M5",d:"Saloon · 717 hp",c:0x6f778c,sp:10,hd:6,s:0},
{n:"BMW iX M60",d:"Electric SUV · 610 hp",c:0xd9d6cf,sp:8,hd:5,s:1},
{n:"BMW M8 Coupé",d:"Grand coupé · 617 hp",c:0x1b1d26,sp:9,hd:7,s:2},
{n:"BMW X5 M",d:"Performance SUV · 617 hp",c:0xe07a1f,sp:8,hd:5,s:1},
{n:"Porsche 911 GT3",d:"Sports car · 502 hp",c:0xf2c200,sp:9,hd:10,s:3},
{n:"Lamborghini Huracán",d:"Supercar · 631 hp",c:0x58c21a,sp:10,hd:8,s:3},
{n:"Mercedes-AMG GT",d:"Coupé · 577 hp",c:0xaeb3bf,sp:9,hd:7,s:2},
{n:"Audi RS e-tron GT",d:"Electric · 637 hp",c:0x7a2fb3,sp:8,hd:8,s:0}];
let sel=0,mode="menu",gmode="taxi";
function renderMenu(){
$("cars").innerHTML=CARS.map((c,i)=>`<button class="car" aria-pressed="${i==sel}" data-i="${i}"><i style="background:#${c.c.toString(16).padStart(6,"0")}"></i><strong>${c.n}</strong><span>${c.d}</span><div class="bar"><u style="width:${c.sp*10}%"></u></div><div class="bar"><u style="width:${c.hd*10}%"></u></div></button>`).join("");
let bv=0;try{bv=+localStorage.getItem("nd_b_"+gmode)||0}catch(e){}
$("modes").innerHTML=[["taxi","Taxi shift"],["gang","Gangster run"]].map(m=>`<button class="car" aria-pressed="${gmode==m[0]}" data-m="${m[0]}">${m[1]}</button>`).join("");
$("best").textContent=(gmode==="taxi"?"Pick up passengers, stop in the glowing bay, drop them off. 3-minute shift. ":"Grab loot, change streets, outrun the cops. ")+"Best $"+bv;
}
renderMenu();
if(typeof THREE==="undefined"){document.body.insertAdjacentHTML("beforeend","<p style='position:fixed;top:50%;width:100%;text-align:center'>3D engine failed to load. Check your connection and reload.</p>");throw 0}
const T=THREE,cv=$("c");
const R=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:"high-performance"});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));
R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.15;
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const cam=new T.PerspectiveCamera(52,1,.1,400);
function size(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener("resize",size);size();
// sky + reflections
const sky=(()=>{const c=document.createElement("canvas");c.width=1024;c.height=512;const x=c.getContext("2d");
const g=x.createLinearGradient(0,0,0,512);[[0,"#0a0820"],[.3,"#231a50"],[.44,"#8f4678"],[.5,"#ffb06a"],[.53,"#4a3058"],[1,"#140e2a"]].forEach(a=>g.addColorStop(a[0],a[1]));
x.fillStyle=g;x.fillRect(0,0,1024,512);
for(let i=0;i<350;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.8})`;x.fillRect(Math.random()*1024,Math.random()*190,1.5,1.5)}
const m=x.createRadialGradient(700,100,2,700,100,50);m.addColorStop(0,"#fff");m.addColorStop(.25,"#ffeccc");m.addColorStop(1,"rgba(255,230,200,0)");x.fillStyle=m;x.fillRect(630,30,140,140);
const t=new T.CanvasTexture(c);t.mapping=T.EquirectangularReflectionMapping;t.encoding=T.sRGBEncoding;return t})();
scene.background=sky;scene.environment=new T.PMREMGenerator(R).fromEquirectangular(sky).texture;
scene.fog=new T.Fog(0x3a2a58,60,260);
scene.add(new T.HemisphereLight(0x8f84d8,0x1a1530,.5));
const sun=new T.DirectionalLight(0xffb27a,1.1);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:50});sun.shadow.bias=-.0004;scene.add(sun,sun.target);
const LW=3.6,RW=LW*4,HALF=RW/2;
const mat=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:.1},o));
const em=c=>new T.MeshBasicMaterial({color:c});
const glowT=(()=>{const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d"),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.3,"rgba(255,255,255,.35)");g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(c)})();
const gm=c=>new T.SpriteMaterial({map:glowT,color:c,blending:T.AdditiveBlending,transparent:true,depthWrite:false});
const GW=gm(0xfff0cc),GR=gm(0xff2a2a),GA=gm(0xffb060);
const glow=(m,s)=>{const o=new T.Sprite(m);o.scale.set(s,s,1);return o};
// road
const noise=(()=>{const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
for(let i=0;i<9000;i++){const v=20+Math.random()*50;x.fillStyle=`rgb(${v},${v},${v+6})`;x.fillRect(Math.random()*256,Math.random()*256,2,2)}
const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(3,100);t.anisotropy=8;t.encoding=T.sRGBEncoding;return t})();
const road=new T.Mesh(new T.PlaneGeometry(RW,700),new T.MeshStandardMaterial({map:noise,color:0x9a9ab0,roughness:.32,metalness:.25,envMapIntensity:1.2}));
road.rotation.x=-Math.PI/2;road.position.z=-300;road.receiveShadow=true;scene.add(road);
const ground=new T.Mesh(new T.PlaneGeometry(400,700),mat(0x120e24,{roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.05,-300);scene.add(ground);
[-1,1].forEach(s=>{
const e=new T.Mesh(new T.BoxGeometry(.16,.02,700),em(0xe8e4d8));e.position.set(s*(HALF-.15),.02,-300);scene.add(e);
const b=new T.Mesh(new T.BoxGeometry(.25,.8,700),mat(0x4a4766,{metalness:.8,roughness:.35}));b.position.set(s*(HALF+.6),.4,-300);scene.add(b);
const r=new T.Mesh(new T.BoxGeometry(.05,.06,700),em(0xffa040));r.position.set(s*(HALF+.47),.62,-300);scene.add(r)});
const dashes=[];
for(let l=1;l<4;l++)for(let i=0;i<26;i++){const d=new T.Mesh(new T.BoxGeometry(.14,.02,4),em(0xd8d3c4));d.position.set(-HALF+LW*l,.02,-i*10+10);scene.add(d);dashes.push(d)}
const poles=[],pm=mat(0x474360,{metalness:.7,roughness:.4});
for(let i=0;i<9;i++)[-1,1].forEach(s=>{
const g=new T.Group();
const p=new T.Mesh(new T.CylinderGeometry(.1,.14,7,8),pm);p.position.y=3.5;
const a=new T.Mesh(new T.BoxGeometry(2.2,.12,.2),pm);a.position.set(-s*1.1,7,0);
const l=new T.Mesh(new T.BoxGeometry(.8,.1,.4),em(0xffd8a0));l.position.set(-s*2,6.9,0);
const sp=glow(GA,7);sp.position.set(-s*2,6.7,0);
const gp=new T.Mesh(new T.PlaneGeometry(9,15),new T.MeshBasicMaterial({map:glowT,color:0xffa040,blending:T.AdditiveBlending,transparent:true,opacity:.55,depthWrite:false}));
gp.rotation.x=-Math.PI/2;gp.position.set(-s*2,.05,0);
g.add(p,a,l,sp,gp);g.position.set(s*(HALF+1.2),0,-i*30+20);scene.add(g);poles.push(g)});
const wt=(()=>{const c=document.createElement("canvas");c.width=64;c.height=128;const x=c.getContext("2d");x.fillStyle="#18132f";x.fillRect(0,0,64,128);
for(let i=0;i<8;i++)for(let j=0;j<16;j++)if(Math.random()<.45){x.fillStyle=Math.random()<.7?"#ffcf8a":"#8fd0ff";x.fillRect(i*8+2,j*8+2,4,5)}
const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t})();
const blds=[];
for(let i=0;i<12;i++)[-1,1].forEach(s=>{
const h=12+Math.random()*40,w=8+Math.random()*8;
const b=new T.Mesh(new T.BoxGeometry(w,h,w),new T.MeshBasicMaterial({map:wt,color:0xa89ed6}));
b.position.set(s*(HALF+10+w/2+Math.random()*18),h/2,-i*22-Math.random()*10);scene.add(b);blds.push(b)});
// cars
const shared={glass:new T.MeshPhysicalMaterial({color:0x080b16,metalness:1,roughness:.04,envMapIntensity:1.6}),tire:mat(0x0b0b0e,{roughness:.9}),chrome:mat(0xc9ccd8,{metalness:1,roughness:.15}),dark:mat(0x050507,{roughness:.6}),disc:mat(0x30323c,{metalness:.9,roughness:.4}),head:em(0xfff6d8),tail:em(0xff2a2a)};
function ext(pts,w,bev){const s=new T.Shape();s.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)s.lineTo(pts[i][0],pts[i][1]);
const g=new T.ExtrudeGeometry(s,{depth:w,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:4,curveSegments:8});g.translate(0,0,-w/2);g.rotateY(Math.PI/2);return g}
const BODY=[
[[-2.25,.34],[2.2,.34],[2.28,.62],[2.18,.8],[1.3,.95],[-1,.98],[-2.15,.95],[-2.28,.72]],
[[-2.25,.42],[2.2,.42],[2.28,.72],[2.18,.92],[1.3,1.02],[-1,1.05],[-2.15,1.02],[-2.28,.8]],
[[-2.25,.34],[2.2,.34],[2.3,.6],[2.2,.76],[1.3,.9],[-1,.96],[-2.15,.93],[-2.28,.7]],
[[-2.2,.3],[2.2,.3],[2.32,.5],[2.2,.66],[1.2,.78],[-1,.86],[-2.1,.86],[-2.28,.62]]];
const CAB=[
[[1.05,.95],[.4,1.42],[-.95,1.42],[-1.75,.95]],
[[1.05,1.02],[.45,1.6],[-1.9,1.6],[-2.05,1.02]],
[[1,.92],[.3,1.34],[-.8,1.34],[-2,.94]],
[[.95,.8],[.15,1.12],[-.8,1.12],[-1.9,.86]]];
const shT=(()=>{const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d"),g=x.createRadialGradient(32,32,2,32,32,32);g.addColorStop(0,"rgba(0,0,0,.8)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(c)})();
const shM=new T.MeshBasicMaterial({map:shT,transparent:true,depthWrite:false}),plate=mat(0xeeeeee,{roughness:.5}),caliper=mat(0xd01818,{roughness:.4});
function buildCar(col,type,full){
const t=+type||0,g=new T.Group(),paint=new T.MeshPhysicalMaterial({color:col,metalness:.85,roughness:.3,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.5});
const bw=t===3?1.74:1.62,cb=CAB[t],box=(w,h,d,m,x,y,z)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);g.add(o);return o};
g.add(new T.Mesh(ext(BODY[t],bw,.1),paint));
g.add(new T.Mesh(ext(cb,bw-.26,.07),shared.glass));
const topY=cb[1][1],rl=cb[1][0]-cb[2][0];
box(bw-.5,.05,rl-.1,paint,0,topY+.06,-(cb[1][0]+cb[2][0])/2);
[-1,1].forEach(s=>box(.2,.12,.14,paint,s*1.02,cb[0][1]+.08,-(cb[0][0]-.15)));
const sh=new T.Mesh(new T.PlaneGeometry(3,5.8),shM);sh.rotation.x=-Math.PI/2;sh.position.y=.02;g.add(sh);
const fy=[.8,.86,.8,.66][t];
if(t===3){box(1.6,.05,.45,paint,0,.98,2.05);[-1,1].forEach(s=>box(.05,.18,.1,shared.dark,s*.6,.88,2.05))}
box(.55,.14,.03,plate,0,.52,2.45);
[-1,1].forEach(s=>{const e=new T.CylinderGeometry(.06,.06,.22,10);e.rotateX(Math.PI/2);const o=new T.Mesh(e,shared.chrome);o.position.set(s*.5,.36,2.38);g.add(o)});
g.userData.w=[];g.userData.tg=[];
[[-1,-1.45],[1,-1.45],[-1,1.45],[1,1.45]].forEach(([x,z])=>{

$("vol").oninput=e=>{CFG.vol=+e.target.value;applyCfg()};
(()=>{const w=$("wheel");let a0=null,rot=0;
const ang=e=>{const r=w.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)};
w.addEventListener("pointerdown",e=>{e.preventDefault();w.setPointerCapture(e.pointerId);a0=ang(e)-rot});
w.addEventListener("pointermove",e=>{if(a0===null)return;let r=ang(e)-a0;while(r>Math.PI)r-=2*Math.PI;while(r<-Math.PI)r+=2*Math.PI;rot=clamp(r,-1.2,1.2);ST.w=clamp(rot/.9,-1,1);w.style.transform=`rotate(${rot}rad)`});
const up=()=>{a0=null;rot=0;ST.w=0;w.style.transform=""};w.addEventListener("pointerup",up);w.addEventListener("pointercancel",up)})();
function pause(on){if(mode!=="play"||S.dead)return;paused=on;$("pause").classList.toggle("hide",!on);$("pz").textContent=on?"▶":"⏸";keys.l=keys.r=keys.n=keys.b=0}
$("pz").onclick=()=>pause(!paused);$("resume").onclick=()=>pause(false);
const openSet=()=>$("set").classList.remove("hide");
$("mset").onclick=openSet;$("pset").onclick=openSet;$("sback").onclick=()=>$("set").classList.add("hide");
$("quit").onclick=()=>{paused=false;S.dead=true;clearWorld();S.speed=0;mode="menu";["pause","pz","ctl"].forEach(i=>$(i).classList.add("hide"));$("menu").classList.remove("hide");setHero();renderMenu()};
$("modes").onclick=e=>{const b=e.target.closest("[data-m]");if(b){gmode=b.dataset.m;renderMenu()}};
addEventListener("keydown",e=>{if(e.key==="Escape"||e.key==="p")pause(!paused)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause(true)});
applyCfg();
let last=performance.now();
function frame(now){
const dt=Math.min((now-last)/1000,.05);last=now;
if(mode==="menu"){showroom(dt);fx(dt)}else if(!(innerHeight>innerWidth&&mode==="play")&&!paused){update(dt);fx(dt)}audioTick();
R.render(scene,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
$("cars").onclick=e=>{const b=e.target.closest(".car");if(b){sel=+b.dataset.i;renderMenu();setHero()}};
const hold=(id,k)=>{const b=$(id),on=e=>{e.preventDefault();keys[k]=1},off=e=>{e.preventDefault();keys[k]=0};
b.addEventListener("pointerdown",on);["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,off))};
hold("bl","l");hold("br","r");hold("bn","n");hold("bb","b");
addEventListener("keydown",e=>{const k=e.key;if(k==="ArrowLeft"||k==="a")keys.l=1;if(k==="ArrowRight"||k==="d")keys.r=1;if(k===" ")keys.n=1;if(k==="s"||k==="ArrowDown")keys.b=1});
addEventListener("keyup",e=>{const k=e.key;if(k==="ArrowLeft"||k==="a")keys.l=0;if(k==="ArrowRight"||k==="d")keys.r=0;if(k===" ")keys.n=0;if(k==="s"||k==="ArrowDown")keys.b=0});
$("go").onclick=start;$("again").onclick=start;
$("chg").onclick=()=>{$("over").classList.add("hide");$("menu").classList.remove("hide");clearWorld();mode="menu";$("bst").style.opacity=0;setHero()};
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
