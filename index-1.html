<html lang="en">

<style>
:root{--bg:#1a1430;--ink:#f3efe6;--mut:#b9b3d6;--acc:#ff9f45;--card:rgba(38,32,68,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.fx{position:fixed;inset:0;pointer-events:none}
#vg{background:radial-gradient(ellipse at center,transparent 55%,rgba(8,4,22,.6))}
#bst{background:radial-gradient(ellipse at center,transparent 50%,rgba(255,159,69,.4));opacity:0;transition:opacity .25s}
.hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;font-weight:700;font-size:13px;pointer-events:none;text-shadow:0 1px 4px #000}
.hud b{font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:5px;background:#403b66;border-radius:3px;margin-top:4px}
.bar u{display:block;height:100%;background:var(--acc);border-radius:3px}
#pop{position:fixed;top:26%;left:0;right:0;text-align:center;font-weight:800;font-size:24px;color:var(--acc);opacity:0;pointer-events:none;text-shadow:0 2px 8px #000}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.panel.hide{display:none}
#menu{justify-content:flex-start;padding:0 max(24px,env(safe-area-inset-left));background:linear-gradient(to right,rgba(20,14,44,.92) 0,rgba(20,14,44,.7) 44%,transparent 60%)}
#over{flex-direction:column;gap:12px;background:rgba(20,14,44,.65)}
.mbox{max-height:100%;overflow:auto;padding:8px 0;width:min(46%,440px);display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:26px;letter-spacing:-1px;font-weight:800}
p{margin:0;color:var(--mut);font-size:13px}
.cars{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:40vh;overflow:auto}
.car{background:var(--card);border:2px solid transparent;border-radius:12px;padding:8px 10px;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.car[aria-pressed=true]{border-color:var(--acc)}
.car:focus-visible,.go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.car i{display:block;height:6px;border-radius:3px;margin-bottom:5px}
.car strong{display:block;font-size:13px}
.car span{font-size:11px;color:var(--mut)}
.go{background:var(--acc);color:#241a0c;border:0;border-radius:30px;font:inherit;font-weight:800;font-size:17px;padding:12px 40px;cursor:pointer}
.ctl{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-end}
.ctl div{display:flex;gap:12px}
.ctl button{width:84px;height:72px;border-radius:20px;border:0;background:rgba(255,255,255,.16);color:var(--ink);font-size:28px;font-weight:700;backdrop-filter:blur(6px)}
.ctl button.n{background:rgba(255,159,69,.42);font-size:15px;width:110px}
.modes{display:flex;gap:8px}.modes .car{flex:1;text-align:center;padding:7px;font-weight:700;font-size:13px}
#job{position:fixed;top:max(60px,calc(env(safe-area-inset-top) + 52px));left:50%;transform:translateX(-50%);max-width:72%;text-align:center;font-weight:700;font-size:13px;padding:5px 14px;border-radius:14px;background:rgba(20,14,44,.62);pointer-events:none;text-shadow:0 1px 3px #000}
#job:empty{display:none}#sir{opacity:0}
.ctl button.b{background:rgba(255,70,70,.45);font-size:15px;width:96px}
#pz{position:fixed;top:max(60px,calc(env(safe-area-inset-top) + 52px));right:max(16px,env(safe-area-inset-right));width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:var(--ink);font-size:20px;backdrop-filter:blur(6px)}
#pause,#set{background:rgba(10,6,22,.62)}
.sbox{width:min(520px,92%);max-height:94%;overflow:auto;background:rgba(24,18,50,.96);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:700}
.seg{display:flex;gap:6px}.seg button{background:var(--card);border:2px solid transparent;border-radius:10px;color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button.on{border-color:var(--acc)}
input[type=range]{width:55%;accent-color:#ff9f45}
#lft{align-items:flex-end}
#wheel{width:132px;height:132px;border-radius:50%;border:12px solid rgba(255,255,255,.38);background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.38)) center/100% 10px no-repeat,linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.38)) 50% 100%/10px 50% no-repeat,rgba(255,255,255,.06);touch-action:none;position:relative}
#wheel::before{content:"";position:absolute;top:-12px;left:50%;width:12px;height:12px;margin-left:-6px;background:var(--acc);border-radius:3px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.item strong{display:block;font-size:13px}.item span{font-size:11px;color:var(--mut);display:block}
button.item{width:100%;border:2px solid transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}button.item[aria-pressed=true]{border-color:var(--acc)}
.tabc{max-height:33vh;overflow:auto}
small{font-size:12px;font-weight:700}
#cv{position:fixed;top:max(60px,calc(env(safe-area-inset-top) + 52px));right:calc(max(16px,env(safe-area-inset-right)) + 58px);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:var(--ink);font-size:20px;backdrop-filter:blur(6px)}
#dbd,#dash,#wip{position:fixed;display:none;pointer-events:none}
#dbd{left:-5%;right:-5%;bottom:-8vh;height:30vh;background:linear-gradient(#0c0c14,#050508);border-radius:50% 50% 0 0/40% 40% 0 0;box-shadow:0 -4px 18px #000}
#dash{left:50%;bottom:-24vh;width:56vh;height:56vh;margin-left:-28vh;border-radius:50%;border:2.6vh solid #101018;background:linear-gradient(#101018,#101018) center/100% 3vh no-repeat,linear-gradient(#101018,#101018) 50% 100%/3vh 50% no-repeat,radial-gradient(circle,#15151e 0 18%,transparent 19%)}
#wip{left:44%;bottom:17vh;width:44vh;height:.9vh;background:#050508;transform-origin:0 50%}
body.cp #dbd,body.cp #dash{display:block}
body.cp.rn #wip{display:block;animation:wp 1.1s ease-in-out infinite alternate}
@keyframes wp{from{transform:rotate(-4deg)}to{transform:rotate(-100deg)}}
@media (prefers-reduced-motion:reduce){body.cp.rn #wip{animation:none}}
.hide{display:none!important}
#rot{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#140e2c;z-index:9;font-size:18px;font-weight:700}
#rot span{font-size:56px;display:block;animation:r 1.8s ease-in-out infinite}
@keyframes r{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){#rot span{animation:none}}
</style>
</head>

<canvas id="c"></canvas>
<div class="fx" id="vg"></div><div class="fx" id="bst"></div>

<div id="dbd"></div><div id="dash"></div><div id="wip"></div><button id="pz" class="hide" aria-label="Pause">⏸</button><button id="cv" class="hide" aria-label="Change camera">📷</button>

<div class="panel hide" id="set"><div class="sbox"><h1>Settings</h1>
<div class="row"><span>Sound</span><div class="seg" data-k="snd"><button data-v="1">On</button><button data-v="0">Off</button></div></div>
<div class="row"><span>Volume</span><input type="range" id="vol" min="0" max="100" aria-label="Volume"></div>
<div class="row"><span>Steering</span><div class="seg" data-k="ctl"><button data-v="btn">Buttons</button><button data-v="wheel">Wheel</button><button data-v="tilt">Tilt</button></div></div>
<div class="row"><span>Invert tilt</span><div class="seg" data-k="inv"><button data-v="0">No</button><button data-v="1">Yes</button></div></div>
<div class="row"><span>Graphics</span><div class="seg" data-k="q"><button data-v="low">Low</button><button data-v="high">High</button></div></div>
<div class="row"><span>Weather</span><div class="seg" data-k="wx"><button data-v="clear">Clear</button><button data-v="rain">Rain</button><button data-v="fog">Fog</button><button data-v="auto">Auto</button></div></div><div class="row"><span>Radio</span><div class="seg" data-k="radio"><button data-v="1">On</button><button data-v="0">Off</button></div></div>
<button class="go" id="sback">Back</button></div></div>
<div id="rot"><span>📱</span>Rotate your phone to landscape</div>

else if(a==="sleep"){SV.day++;SV.hour=7;const bill=Math.min(SV.cash,40);SV.cash-=bill;MSG=`Day ${SV.day}. Bills −$${bill}.`;
 if(SV.hu.chg){SV.fuel=100;MSG+=" Car charged."}if(SV.hu.rep&&SV.dmg){SV.dmg=0;MSG+=" Car repaired."}selTask={mode:selTask.mode,t:selTask.t,d:selTask.d,free:1}}
save();renderMenu()};
// ---- pause and controls
function pause(on){if(mode!=="play"||S.dead)return;paused=on;$("pause").classList.toggle("hide",!on);$("pz").textContent=on?"▶":"⏸";keys.l=keys.r=keys.n=keys.b=0}
$("pz").onclick=()=>pause(!paused);$("resume").onclick=()=>pause(false);
$("cv").onclick=()=>{CAMV=(CAMV+1)%3;applyView()};
const openSet=()=>$("set").classList.remove("hide");
$("mset").onclick=openSet;$("pset").onclick=openSet;$("sback").onclick=()=>$("set").classList.add("hide");
$("quit").onclick=()=>{paused=false;if(!S.dead){S.dead=true;bank()}clearWorld();S.speed=0;mode="menu";CAMV=0;["pause","pz","cv","ctl"].forEach(i=>$(i).classList.add("hide"));$("menu").classList.remove("hide");setHero();renderMenu()};
addEventListener("keydown",e=>{const k=e.key;if(k==="Escape"||k==="p")pause(!paused);if(k==="c"){CAMV=(CAMV+1)%3;applyView()}if(k==="h")honk();
if(k==="ArrowLeft"||k==="a")keys.l=1;if(k==="ArrowRight"||k==="d")keys.r=1;if(k===" ")keys.n=1;if(k==="s"||k==="ArrowDown")keys.b=1});
addEventListener("keyup",e=>{const k=e.key;if(k==="ArrowLeft"||k==="a")keys.l=0;if(k==="ArrowRight"||k==="d")keys.r=0;if(k===" ")keys.n=0;if(k==="s"||k==="ArrowDown")keys.b=0});
const hold=(id,k)=>{const b=$(id),on=e=>{e.preventDefault();keys[k]=1},off=e=>{e.preventDefault();keys[k]=0};
b.addEventListener("pointerdown",on);["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,off))};
hold("bl","l");hold("br","r");hold("bn","n");hold("bb","b");
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause(true)});
$("go").onclick=start;$("again").onclick=start;
$("chg").onclick=()=>{$("over").classList.add("hide");$("menu").classList.remove("hide");clearWorld();mode="menu";CAMV=0;setHero();renderMenu()};
renderMenu();applyCfg();applyView();setTime(SV.hour);
let last=performance.now();
function frame(now){
const dt=Math.min((now-last)/1000,.05);last=now;
if(mode==="menu"){showroom(dt);fx(dt)}else if(!(innerHeight>innerWidth&&mode==="play")&&!paused){update(dt);fx(dt)}audioTick();
R.render(scene,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
